
name: AutoClickerNuevo APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Preparar Android SDK
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "No se encontró sdkmanager"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Crear proyecto Android
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/autoclicker/android
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AutoClickerNuevo"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.autoclicker.android'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.autoclicker.android'
                  minSdk 24
                  targetSdk 28
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>

              <application
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:label="AutoClickerNuevo"
                  android:allowBackup="false">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".AutoClickService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService"/>
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config"/>
                  </service>

                  <service
                      android:name=".FloatingPanelService"
                      android:exported="false"/>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/xml/accessibility_service_config.xml <<'EOF'
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:description="@string/accessibility_description"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:canPerformGestures="true"
              android:notificationTimeout="50"/>
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="accessibility_description">Servicio de clics controlado por el usuario.</string>
          </resources>
          EOF

          cat > app/src/main/java/com/autoclicker/android/MainActivity.java <<'EOF'
          package com.autoclicker.android;

          import android.app.Activity;
          import android.app.AlertDialog;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.view.Gravity;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          public class MainActivity extends Activity {
              @Override
              public void onCreate(Bundle b) {
                  super.onCreate(b);

                  LinearLayout l = new LinearLayout(this);
                  l.setOrientation(LinearLayout.VERTICAL);
                  l.setPadding(24, 30, 24, 24);
                  l.setGravity(Gravity.CENTER_HORIZONTAL);

                  TextView title = new TextView(this);
                  title.setText("AutoClickerNuevo");
                  title.setTextSize(25);
                  l.addView(title);

                  add(l, "1. Permitir panel flotante", () -> {
                      if (!Settings.canDrawOverlays(this)) {
                          startActivity(new Intent(
                              Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                              Uri.parse("package:" + getPackageName())));
                      }
                  });

                  add(l, "2. Activar accesibilidad", () ->
                      startActivity(new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)));

                  add(l, "3. Abrir panel flotante", () -> {
                      if (Settings.canDrawOverlays(this)) {
                          startService(new Intent(this, FloatingPanelService.class));
                      } else {
                          new AlertDialog.Builder(this)
                              .setMessage("Primero permite el panel flotante.")
                              .setPositiveButton("Aceptar", null)
                              .show();
                      }
                  });

                  setContentView(l);
              }

              private void add(LinearLayout l, String label, Runnable action) {
                  Button b = new Button(this);
                  b.setText(label);
                  l.addView(b, new LinearLayout.LayoutParams(-1, -2));
                  b.setOnClickListener(v -> action.run());
              }
          }
          EOF

          cat > app/src/main/java/com/autoclicker/android/AutoClickService.java <<'EOF'
          package com.autoclicker.android;

          import android.accessibilityservice.AccessibilityService;
          import android.accessibilityservice.GestureDescription;
          import android.graphics.Path;
          import android.view.accessibility.AccessibilityEvent;

          public class AutoClickService extends AccessibilityService {
              private static AutoClickService instance;

              @Override
              protected void onServiceConnected() {
                  super.onServiceConnected();
                  instance = this;
              }

              public static boolean isConnected() {
                  return instance != null;
              }

              public static boolean click(float x, float y) {
                  if (instance == null) return false;

                  Path path = new Path();
                  path.moveTo(x, y);

                  GestureDescription gesture =
                      new GestureDescription.Builder()
                          .addStroke(new GestureDescription.StrokeDescription(path, 0, 1))
                          .build();

                  return instance.dispatchGesture(gesture, null, null);
              }

              @Override
              public void onAccessibilityEvent(AccessibilityEvent event) {}

              @Override
              public void onInterrupt() {}

              @Override
              public void onDestroy() {
                  if (instance == this) instance = null;
                  super.onDestroy();
              }
          }
          EOF

          cat > app/src/main/java/com/autoclicker/android/FloatingPanelService.java <<'EOF'
          package com.autoclicker.android;

          import android.app.Service;
          import android.content.Intent;
          import android.graphics.Color;
          import android.graphics.PixelFormat;
          import android.graphics.drawable.GradientDrawable;
          import android.os.Handler;
          import android.os.IBinder;
          import android.provider.Settings;
          import android.view.Gravity;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.WindowManager;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.SeekBar;
          import android.widget.TextView;

          public class FloatingPanelService extends Service {
              private WindowManager wm;
              private WindowManager.LayoutParams panelParams, markerParams;

              private LinearLayout panel, content;
              private ScrollView scrollView;
              private TextView counter, status;
              private TextView sizeLabel, transparencyLabel;
              private TextView resizeHandle;
              private View marker;
              private EditText xInput, yInput, intervalInput;
              private SeekBar sizeSeekBar, transparencySeekBar;

              private final Handler handler = new Handler();

              private boolean running = false;
              private int clicks = 0;

              private int x = 300;
              private int y = 500;

              private int markerSize = 54;
              private int transparency = 30;

              private int minPanelWidth = 230;
              private int minPanelHeight = 300;

              private Runnable clickTask;

              @Override
              public IBinder onBind(Intent intent) {
                  return null;
              }

              @Override
              public void onCreate() {
                  super.onCreate();

                  if (!Settings.canDrawOverlays(this)) {
                      stopSelf();
                      return;
                  }

                  wm = (WindowManager) getSystemService(WINDOW_SERVICE);

                  createMarker();
                  createPanel();
              }

              private int overlayType() {
                  if (android.os.Build.VERSION.SDK_INT >= 26) {
                      return WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY;
                  }
                  return WindowManager.LayoutParams.TYPE_PHONE;
              }

              private void createMarker() {
                  marker = new View(this);

                  markerParams = new WindowManager.LayoutParams(
                      markerSize,
                      markerSize,
                      overlayType(),
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  );

                  markerParams.gravity = Gravity.TOP | Gravity.START;
                  markerParams.x = x - markerSize / 2;
                  markerParams.y = y - markerSize / 2;

                  updateMarkerAppearance();

                  marker.setOnTouchListener((v, e) -> {
                      if (e.getAction() == MotionEvent.ACTION_DOWN) {
                          v.setTag(new float[]{
                              e.getRawX(), e.getRawY(),
                              markerParams.x, markerParams.y
                          });
                          return true;
                      }

                      if (e.getAction() == MotionEvent.ACTION_MOVE) {
                          float[] a = (float[]) v.getTag();

                          markerParams.x = (int) (
                              a[2] + e.getRawX() - a[0]
                          );
                          markerParams.y = (int) (
                              a[3] + e.getRawY() - a[1]
                          );

                          x = markerParams.x + markerSize / 2;
                          y = markerParams.y + markerSize / 2;

                          wm.updateViewLayout(marker, markerParams);
                          syncCoordinates();
                          return true;
                      }

                      return e.getAction() == MotionEvent.ACTION_UP;
                  });

                  wm.addView(marker, markerParams);
              }

              private void updateMarkerAppearance() {
                  if (marker == null) return;

                  GradientDrawable circle = new GradientDrawable();
                  circle.setShape(GradientDrawable.OVAL);

                  int alpha = (int) (
                      255 * (100 - transparency) / 100.0
                  );

                  circle.setColor(Color.argb(alpha, 255, 0, 0));
                  marker.setBackground(circle);
              }

              private void updateMarkerSize(int newSize) {
                  markerSize = Math.max(20, Math.min(120, newSize));

                  if (markerParams != null && marker != null) {
                      markerParams.width = markerSize;
                      markerParams.height = markerSize;
                      markerParams.x = x - markerSize / 2;
                      markerParams.y = y - markerSize / 2;
                      wm.updateViewLayout(marker, markerParams);
                  }

                  updateMarkerAppearance();
              }

              private void createPanel() {
                  panel = new LinearLayout(this);
                  panel.setOrientation(LinearLayout.VERTICAL);
                  panel.setPadding(8, 6, 8, 6);
                  panel.setBackgroundColor(Color.WHITE);

                  TextView title = new TextView(this);
                  title.setText("AutoClicker  ☰");
                  title.setTextColor(Color.BLACK);
                  title.setTextSize(18);
                  title.setPadding(4, 8, 4, 8);
                  title.setOnTouchListener(dragPanel());
                  panel.addView(title);

                  scrollView = new ScrollView(this);
                  scrollView.setFillViewport(false);

                  content = new LinearLayout(this);
                  content.setOrientation(LinearLayout.VERTICAL);
                  scrollView.addView(content);

                  panel.addView(scrollView, new LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.MATCH_PARENT, 0, 1
                  ));

                  xInput = field("Coordenada X", String.valueOf(x));
                  yInput = field("Coordenada Y", String.valueOf(y));
                  intervalInput = field("Intervalo en ms (mínimo 10)", "100");

                  rowButton("UBICAR PUNTO", () -> {
                      readCoordinates();
                      updateMarkerPosition();
                      status.setText("Punto actualizado");
                  });

                  counter = new TextView(this);
                  counter.setTextColor(Color.BLACK);
                  counter.setText("Clics: 0");
                  content.addView(counter);

                  status = new TextView(this);
                  status.setTextColor(Color.DKGRAY);
                  status.setText("Pausado");
                  content.addView(status);

                  rowButton("INICIAR", this::startClicks);
                  rowButton("PAUSAR", this::pauseClicks);

                  rowButton("REINICIAR CONTADOR", () -> {
                      clicks = 0;
                      counter.setText("Clics: 0");
                  });

                  sizeLabel = new TextView(this);
                  sizeLabel.setTextColor(Color.BLACK);
                  content.addView(sizeLabel);

                  sizeSeekBar = new SeekBar(this);
                  sizeSeekBar.setMax(100);
                  sizeSeekBar.setProgress(markerSize - 20);
                  sizeLabel.setText("Tamaño del punto: " + markerSize + " px");

                  sizeSeekBar.setOnSeekBarChangeListener(
                      new SeekBar.OnSeekBarChangeListener() {
                          @Override
                          public void onProgressChanged(
                              SeekBar seekBar, int progress, boolean fromUser
                          ) {
                              int newSize = 20 + progress;
                              sizeLabel.setText(
                                  "Tamaño del punto: " + newSize + " px"
                              );
                              if (fromUser) updateMarkerSize(newSize);
                          }

                          @Override
                          public void onStartTrackingTouch(SeekBar seekBar) {}

                          @Override
                          public void onStopTrackingTouch(SeekBar seekBar) {}
                      }
                  );
                  content.addView(sizeSeekBar);

                  transparencyLabel = new TextView(this);
                  transparencyLabel.setTextColor(Color.BLACK);
                  transparencyLabel.setText("Transparencia: " + transparency + "%");
                  content.addView(transparencyLabel);

                  transparencySeekBar = new SeekBar(this);
                  transparencySeekBar.setMax(90);
                  transparencySeekBar.setProgress(transparency);

                  transparencySeekBar.setOnSeekBarChangeListener(
                      new SeekBar.OnSeekBarChangeListener() {
                          @Override
                          public void onProgressChanged(
                              SeekBar seekBar, int progress, boolean fromUser
                          ) {
                              transparency = progress;
                              transparencyLabel.setText(
                                  "Transparencia: " + transparency + "%"
                              );
                              updateMarkerAppearance();
                          }

                          @Override
                          public void onStartTrackingTouch(SeekBar seekBar) {}

                          @Override
                          public void onStopTrackingTouch(SeekBar seekBar) {}
                      }
                  );
                  content.addView(transparencySeekBar);

                  rowButton("CERRAR PANEL", this::stopSelf);

                  resizeHandle = new TextView(this);
                  resizeHandle.setText("◢ Arrastra aquí para cambiar tamaño");
                  resizeHandle.setTextColor(Color.BLACK);
                  resizeHandle.setPadding(8, 12, 8, 12);
                  resizeHandle.setBackgroundColor(0xFFE0E0E0);
                                    resizeHandle.setOnTouchListener(new View.OnTouchListener() {
                      private int startY;
                      private int startHeight;

                      @Override
                      public boolean onTouch(View v, MotionEvent event) {
                          switch (event.getAction()) {
                              case MotionEvent.ACTION_DOWN:
                                  startY = (int) event.getRawY();
                                  startHeight = panelParams.height;
                                  return true;

                              case MotionEvent.ACTION_MOVE:
                                  int delta = (int) event.getRawY() - startY;
                                  panelParams.height = Math.max(200, startHeight + delta);
                                  wm.updateViewLayout(panel, panelParams);
                                  return true;
                          }
                          return true;
                      }
                  });

                  panel.addView(resizeHandle);
                  wm.addView(panel, panelParams);
              }

              private void rowButton(String text, Runnable action) {
                  Button button = new Button(this);
                  button.setText(text);
                  button.setOnClickListener(v -> action.run());
                  content.addView(button);
              }

              @Override
              public void onDestroy() {
                  handler.removeCallbacksAndMessages(null);
                  if (wm != null) {
                      if (panel != null) wm.removeView(panel);
                      if (marker != null) wm.removeView(marker);
                  }
                  super.onDestroy();
              }
          }
          EOF
        
