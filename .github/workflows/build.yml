name: AutoClickerNuevo APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Preparar Android SDK
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "No se encontró sdkmanager"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Crear proyecto Android
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/autoclicker/android
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/values

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AutoClickerAndroid"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
          }
          android {
              namespace = "com.autoclicker.android"
              compileSdk = 35
              defaultConfig {
                  applicationId = "com.autoclicker.android"
                  minSdk = 23
                  targetSdk = 28
                  versionCode = 1
                  versionName = "1.0"
              }
          }
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">AutoClickerNuevo</string>
              <string name="accessibility_description">Servicio de clics mediante gestos autorizados.</string>
          </resources>
          EOF

          cat > app/src/main/res/xml/accessibility_service_config.xml <<'EOF'
          <accessibility-service
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:description="@string/accessibility_description"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:canPerformGestures="true"
              android:notificationTimeout="0" />
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <application
                  android:allowBackup="false"
                  android:label="@string/app_name"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".AutoClickService"
                      android:label="AutoClicker"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>
                  <service
                      android:name=".FloatingPanelService"
                      android:exported="false" />
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/autoclicker/android/MainActivity.java <<'EOF'
          package com.autoclicker.android;

          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.view.Gravity;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          public class MainActivity extends Activity {
              @Override
              public void onCreate(Bundle b) {
                  super.onCreate(b);
                  LinearLayout layout = new LinearLayout(this);
                  layout.setOrientation(LinearLayout.VERTICAL);
                  layout.setPadding(24, 32, 24, 24);
                  layout.setGravity(Gravity.CENTER_HORIZONTAL);

                  TextView title = new TextView(this);
                  title.setText("AutoClickerNuevo");
                  title.setTextSize(25);
                  layout.addView(title);

                  Button accessibility = new Button(this);
                  accessibility.setText("Activar accesibilidad");
                  accessibility.setOnClickListener(v ->
                      startActivity(new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)));
                  layout.addView(accessibility);

                  Button overlay = new Button(this);
                  overlay.setText("Permitir panel flotante");
                  overlay.setOnClickListener(v -> {
                      if (!Settings.canDrawOverlays(this)) {
                          startActivity(new Intent(
                              Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                              Uri.parse("package:" + getPackageName())));
                      }
                  });
                  layout.addView(overlay);

                  Button open = new Button(this);
                  open.setText("Abrir panel");
                  open.setOnClickListener(v -> {
                      if (Settings.canDrawOverlays(this)) {
                          startService(new Intent(this, FloatingPanelService.class));
                      } else {
                          startActivity(new Intent(
                              Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                              Uri.parse("package:" + getPackageName())));
                      }
                  });
                  layout.addView(open);
                  setContentView(layout);
              }
          }
          EOF

          cat > app/src/main/java/com/autoclicker/android/AutoClickService.java <<'EOF'
          package com.autoclicker.android;

          import android.accessibilityservice.AccessibilityService;
          import android.accessibilityservice.GestureDescription;
          import android.graphics.Path;
          import android.os.Build;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.accessibility.AccessibilityEvent;

          public class AutoClickService extends AccessibilityService {
              private static AutoClickService instance;
              private final Handler handler = new Handler(Looper.getMainLooper());
              private boolean running;
              private int x = 300, y = 500;
              private long interval = 100;

              private final Runnable task = new Runnable() {
                  @Override public void run() {
                      if (!running) return;
                      clickOnce();
                      handler.postDelayed(this, interval);
                  }
              };

              public static AutoClickService getInstance() {
                  return instance;
              }

              @Override public void onServiceConnected() {
                  super.onServiceConnected();
                  instance = this;
              }

              public void setPosition(int px, int py) {
                  x = px;
                  y = py;
              }

              public void setInterval(long ms) {
                  interval = Math.max(50, ms);
              }

              public void startClicks() {
                  if (running) return;
                  running = true;
                  handler.post(task);
              }

              public void stopClicks() {
                  running = false;
                  handler.removeCallbacks(task);
              }

              private void clickOnce() {
                  if (Build.VERSION.SDK_INT < 24) return;
                  Path path = new Path();
                  path.moveTo(x, y);
                  GestureDescription gesture =
                      new GestureDescription.Builder()
                          .addStroke(new GestureDescription.StrokeDescription(path, 0, 50))
                          .build();
                  dispatchGesture(gesture, null, null);
              }

              @Override public void onAccessibilityEvent(AccessibilityEvent event) {}
              @Override public void onInterrupt() { stopClicks(); }

              @Override public void onDestroy() {
                  stopClicks();
                  instance = null;
                  super.onDestroy();
              }
          }
          EOF

          cat > app/src/main/java/com/autoclicker/android/FloatingPanelService.java <<'EOF'
          package com.autoclicker.android;

          import android.app.Service;
          import android.content.Intent;
          import android.graphics.Color;
          import android.graphics.PixelFormat;
          import android.graphics.drawable.GradientDrawable;
          import android.os.Build;
          import android.os.IBinder;
          import android.provider.Settings;
          import android.view.Gravity;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.WindowManager;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.SeekBar;
          import android.widget.TextView;

          public class FloatingPanelService extends Service {
              private WindowManager wm;
              private LinearLayout panel;
              private TextView marker;
              private WindowManager.LayoutParams panelParams, markerParams;
              private int markerSize = 48;
              private int clicksPerSecond = 10;

              @Override public void onCreate() {
                  super.onCreate();
                  if (!Settings.canDrawOverlays(this)) {
                      stopSelf();
                      return;
                  }
                  wm = (WindowManager) getSystemService(WINDOW_SERVICE);
                  int type = Build.VERSION.SDK_INT >= 26
                      ? WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                      : WindowManager.LayoutParams.TYPE_PHONE;

                  panelParams = new WindowManager.LayoutParams(
                      280, WindowManager.LayoutParams.WRAP_CONTENT, type,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT);
                  panelParams.gravity = Gravity.TOP | Gravity.START;
                  panelParams.x = 20;
                  panelParams.y = 120;

                  panel = new LinearLayout(this);
                  panel.setOrientation(LinearLayout.VERTICAL);
                  panel.setPadding(12, 12, 12, 12);
                  panel.setBackgroundColor(0xEEFFFFFF);

                  TextView title = new TextView(this);
                  title.setText("AutoClickerNuevo");
                  title.setTextColor(Color.BLACK);
                  title.setTextSize(18);
                  panel.addView(title);

                  Button start = new Button(this);
                  start.setText("INICIAR CLICS");
                  start.setOnClickListener(v -> {
                      AutoClickService s = AutoClickService.getInstance();
                      if (s != null) {
                          s.setInterval(1000L / clicksPerSecond);
                          s.startClicks();
                      }
                  });
                  panel.addView(start);

                  Button stop = new Button(this);
                  stop.setText("DETENER CLICS");
                  stop.setOnClickListener(v -> {
                      AutoClickService s = AutoClickService.getInstance();
                      if (s != null) s.stopClicks();
                  });
                  panel.addView(stop);

                  TextView speedLabel = new TextView(this);
                  speedLabel.setText("Velocidad: " + clicksPerSecond + " clics/seg");
                  speedLabel.setTextColor(Color.BLACK);
                  panel.addView(speedLabel);

                  SeekBar speed = new SeekBar(this);
                  speed.setMax(19);
                  speed.setProgress(9);
                  speed.setOnSeekBarChangeListener(new SeekBar.OnSeekBarChangeListener() {
                      @Override public void onProgressChanged(SeekBar b, int p, boolean u) {
                          clicksPerSecond = p + 1;
                          speedLabel.setText("Velocidad: " + clicksPerSecond + " clics/seg");
                          AutoClickService s = AutoClickService.getInstance();
                          if (s != null) s.setInterval(1000L / clicksPerSecond);
                      }
                      @Override public void onStartTrackingTouch(SeekBar b) {}
                      @Override public void onStopTrackingTouch(SeekBar b) {}
                  });
                  panel.addView(speed);

                  TextView sizeLabel = new TextView(this);
                  sizeLabel.setText("Tamaño del punto");
                  sizeLabel.setTextColor(Color.BLACK);
                  panel.addView(sizeLabel);

                  SeekBar size = new SeekBar(this);
                  size.setMax(100);
                  size.setProgress(28);
                  size.setOnSeekBarChangeListener(new SeekBar.OnSeekBarChangeListener() {
                      @Override public void onProgressChanged(SeekBar b, int p, boolean u) {
                          markerSize = p + 20;
                          if (marker != null && markerParams != null) {
                              markerParams.width = markerSize;
                              markerParams.height = markerSize;
                              wm.updateViewLayout(marker, markerParams);
                          }
                      }
                      @Override public void onStartTrackingTouch(SeekBar b) {}
                      @Override public void onStopTrackingTouch(SeekBar b) {}
                  });
                  panel.addView(size);

                  Button close = new Button(this);
                  close.setText("CERRAR PANEL");
                  close.setOnClickListener(v -> stopSelf());
                  panel.addView(close);

                  wm.addView(panel, panelParams);
                  createMarker(type);
                  panel.setOnTouchListener(new View.OnTouchListener() {
                      private int sx, sy, px, py;
                      @Override public boolean onTouch(View v, MotionEvent e) {
                          if (e.getAction() == MotionEvent.ACTION_DOWN) {
                              sx = (int)e.getRawX();
                              sy = (int)e.getRawY();
                              px = panelParams.x;
                              py = panelParams.y;
                              return false;
                          }
                          if (e.getAction() == MotionEvent.ACTION_MOVE) {
                              panelParams.x = px + (int)e.getRawX() - sx;
                              panelParams.y = py + (int)e.getRawY() - sy;
                              wm.updateViewLayout(panel, panelParams);
                              return false;
                          }
                          return false;
                      }
                  });
              }

              private void createMarker(int type) {
                  marker = new TextView(this);
                  marker.setText("●");
                  marker.setTextSize(markerSize / 2f);
                  marker.setGravity(Gravity.CENTER);
                  marker.setTextColor(Color.RED);
                  GradientDrawable bg = new GradientDrawable();
                  bg.setColor(0x22FF0000);
                  bg.setShape(GradientDrawable.OVAL);
                  bg.setStroke(2, Color.RED);
                  marker.setBackground(bg);

                  markerParams = new WindowManager.LayoutParams(
                      markerSize, markerSize, type,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE
                          | WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL,
                      PixelFormat.TRANSLUCENT);
                  markerParams.gravity = Gravity.TOP | Gravity.START;
                  markerParams.x = 300;
                  markerParams.y = 500;

                  marker.setOnTouchListener(new View.OnTouchListener() {
                      private int sx, sy, px, py;
                      @Override public boolean onTouch(View v, MotionEvent e) {
                          if (e.getAction() == MotionEvent.ACTION_DOWN) {
                              sx = (int)e.getRawX();
                              sy = (int)e.getRawY();
                              px = markerParams.x;
                              py = markerParams.y;
                              return true;
                          }
                          if (e.getAction() == MotionEvent.ACTION_MOVE) {
                              markerParams.x = px + (int)e.getRawX() - sx;
                              markerParams.y = py + (int)e.getRawY() - sy;
                              wm.updateViewLayout(marker, markerParams);
                              AutoClickService s = AutoClickService.getInstance();
                              if (s != null) s.setPosition(
                                  markerParams.x + markerSize / 2,
                                  markerParams.y + markerSize / 2);
                              return true;
                          }
                          return true;
                      }
                  });
                  wm.addView(marker, markerParams);
              }

              @Override public int onStartCommand(Intent i, int f, int id) {
                  return START_STICKY;
              }

              @Override public void onDestroy() {
                  AutoClickService s = AutoClickService.getInstance();
                  if (s != null) s.stopClicks();
                  if (wm != null) {
                      if (panel != null) wm.removeView(pane
