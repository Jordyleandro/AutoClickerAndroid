package com.autoclicker.android;

import android.app.Service;
import android.content.Intent;
import android.graphics.Color;
import android.graphics.PixelFormat;
import android.graphics.drawable.GradientDrawable;
import android.os.Build;
import android.os.Handler;
import android.os.IBinder;
import android.provider.Settings;
import android.view.Gravity;
import android.view.MotionEvent;
import android.view.View;
import android.view.WindowManager;
import android.view.inputmethod.InputMethodManager;
import android.content.Context;
import android.widget.Button;
import android.widget.EditText;
import android.widget.LinearLayout;
import android.widget.ScrollView;
import android.widget.SeekBar;
import android.widget.TextView;

public class FloatingPanelService extends Service {
    private WindowManager wm;
    private WindowManager.LayoutParams panelParams, markerParams;
    private LinearLayout panel, content;
    private TextView counter, status, sizeLabel, alphaLabel;
    private View marker, resizeHandle;
    private EditText xInput, yInput, intervalInput;
    private SeekBar sizeSeek, alphaSeek;
    private final Handler handler = new Handler();

    private boolean running = false;
    private int clicks = 0;
    private int x = 300, y = 500;
    private int markerSize = 40;
    private int markerAlpha = 190;
    private int panelWidth = 300, panelHeight = 560;
    private Runnable clickTask;

    @Override
    public IBinder onBind(Intent intent) {
        return null;
    }

    @Override
    public void onCreate() {
        super.onCreate();

        if (!Settings.canDrawOverlays(this)) {
            stopSelf();
            return;
        }

        wm = (WindowManager) getSystemService(WINDOW_SERVICE);
        createMarker();
        createPanel();
    }

    private int overlayType() {
        return Build.VERSION.SDK_INT >= 26
            ? WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
            : WindowManager.LayoutParams.TYPE_PHONE;
    }

    private void createMarker() {
        marker = new View(this);
        updateMarkerAppearance();

        markerParams = new WindowManager.LayoutParams(
            markerSize, markerSize,
            overlayType(),
            WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
            PixelFormat.TRANSLUCENT
        );

        markerParams.gravity = Gravity.TOP | Gravity.START;
        markerParams.x = x - markerSize / 2;
        markerParams.y = y - markerSize / 2;

        marker.setOnTouchListener((v, e) -> {
            if (e.getAction() == MotionEvent.ACTION_DOWN) {
                v.setTag(new float[]{
                    e.getRawX(), e.getRawY(),
                    markerParams.x, markerParams.y
                });
                return true;
            }

            if (e.getAction() == MotionEvent.ACTION_MOVE) {
                float[] a = (float[]) v.getTag();

                markerParams.x = (int) (a[2] + e.getRawX() - a[0]);
                markerParams.y = (int) (a[3] + e.getRawY() - a[1]);

                x = markerParams.x + markerSize / 2;
                y = markerParams.y + markerSize / 2;

                wm.updateViewLayout(marker, markerParams);
                syncCoordinates();
                return true;
            }

            return e.getAction() == MotionEvent.ACTION_UP;
        });

        wm.addView(marker, markerParams);
    }

    private void updateMarkerAppearance() {
        GradientDrawable circle = new GradientDrawable();
        circle.setShape(GradientDrawable.OVAL);
        circle.setColor(Color.RED);
        circle.setAlpha(markerAlpha);
        circle.setStroke(2, Color.argb(
            Math.min(255, markerAlpha + 40), 150, 0, 0
        ));
        marker.setBackground(circle);
    }

    private void createPanel() {
        panel = new LinearLayout(this);
        panel.setOrientation(LinearLayout.VERTICAL);
        panel.setPadding(8, 6, 8, 6);
        panel.setBackgroundColor(Color.WHITE);

        TextView title = new TextView(this);
        title.setText("AutoClicker  ☰");
        title.setTextColor(Color.BLACK);
        title.setTextSize(18);
        title.setPadding(5, 8, 5, 8);
        title.setOnTouchListener(dragPanel());
        panel.addView(title);

        ScrollView scroll = new ScrollView(this);
        content = new LinearLayout(this);
        content.setOrientation(LinearLayout.VERTICAL);
        scroll.addView(content);
        panel.addView(scroll, new LinearLayout.LayoutParams(
            -1, 0, 1
        ));

        xInput = field("Coordenada X", String.valueOf(x));
        yInput = field("Coordenada Y", String.valueOf(y));
        intervalInput = field("Intervalo en ms (mín. 10)", "100");

        rowButton("APLICAR COORDENADAS", () -> {
            x = number(xInput, x);
            y = number(yInput, y);

            markerParams.x = x - markerSize / 2;
            markerParams.y = y - markerSize / 2;

            wm.updateViewLayout(marker, markerParams);
            status.setText("Punto actualizado");
        });

        sizeLabel = label("Tamaño del punto: " + markerSize);
        sizeSeek = new SeekBar(this);
        sizeSeek.setMax(96);
        sizeSeek.setProgress(markerSize - 8);
        content.addView(sizeSeek);
        sizeSeek.setOnSeekBarChangeListener(new SeekBar.OnSeekBarChangeListener() {
            @Override
            public void onProgressChanged(SeekBar bar, int progress, boolean user) {
                markerSize = progress + 8;
                sizeLabel.setText("Tamaño del punto: " + markerSize);
                markerParams.width = markerSize;
                markerParams.height = markerSize;
                markerParams.x = x - markerSize / 2;
                markerParams.y = y - markerSize / 2;
                updateMarkerAppearance();
                wm.updateViewLayout(marker, markerParams);
            }
            @Override public void onStartTrackingTouch(SeekBar bar) {}
            @Override public void onStopTrackingTouch(SeekBar bar) {}
        });

        alphaLabel = label("Opacidad: " + (markerAlpha * 100 / 255) + "%");
        alphaSeek = new SeekBar(this);
        alphaSeek.setMax(255);
        alphaSeek.setProgress(markerAlpha);
        content.addView(alphaSeek);
        alphaSeek.setOnSeekBarChangeListener(new SeekBar.OnSeekBarChangeListener() {
            @Override
            public void onProgressChanged(SeekBar bar, int progress, boolean user) {
                markerAlpha = progress;
                alphaLabel.setText("Opacidad: " + (progress * 100 / 255) + "%");
                updateMarkerAppearance();
            }
            @Override public void onStartTrackingTouch(SeekBar bar) {}
            @Override public void onStopTrackingTouch(SeekBar bar) {}
        });

        counter = label("Clics: 0");
        status = label("Pausado");

        rowButton("INICIAR", this::startClicks);
        rowButton("PAUSAR", this::pauseClicks);
        rowButton("REINICIAR CONTADOR", () -> {
            clicks = 0;
            counter.setText("Clics: 0");
        });
        rowButton("CERRAR PANEL", this::stopSelf);

        resizeHandle = new TextView(this);
        ((TextView) resizeHandle).setText("◢ Arrastra para cambiar el tamaño");
        ((TextView) resizeHandle).setTextColor(Color.DKGRAY);
        ((TextView) resizeHandle).setGravity(Gravity.RIGHT);
        resizeHandle.setPadding(4, 8, 4, 8);
        panel.addView(resizeHandle);

        resizeHandle.setOnTouchListener((v, e) -> {
            if (e.getAction() == MotionEvent.ACTION_DOWN) {
                v.setTag(new float[]{
                    e.getRawX(), e.getRawY(),
                    panelParams.width, panelParams.height
                });
                return true;
            }

            if (e.getAction() == MotionEvent.ACTION_MOVE) {
                float[] a = (float[]) v.getTag();

                panelWidth = Math.max(220, Math.min(900,
                    (int) (a[2] + e.getRawX() - a[0])));
                panelHeight = Math.max(260, Math.min(1400,
                    (int) (a[3] + e.getRawY() - a[1])));

                panelParams.width = panelWidth;
                panelParams.height = panelHeight;
                wm.updateViewLayout(panel, panelParams);
                return true;
            }

            return e.getAction() == MotionEvent.ACTION_UP;
        });

        panelParams = new WindowManager.LayoutParams(
            panelWidth, panelHeight,
            overlayType(),
            WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL,
            PixelFormat.TRANSLUCENT
        );

        panelParams.gravity = Gravity.TOP | Gravity.END;
        panelParams.x = 10;
        panelParams.y = 120;
        wm.addView(panel, panelParams);
    }

    private EditText field(String hint, String value) {
        EditText e = new EditText(this);
        e.setSingleLine(true);
        e.setText(value);
        e.setHint(hint);
        e.setTextColor(Color.BLACK);
        e.setSelectAllOnFocus(true);
        content.addView(e, new LinearLayout.LayoutParams(-1, 48));
        return e;
    }

    private TextView label(String text) {
        TextView t = new TextView(this);
        t.setText(text);
        t.setTextColor(Color.BLACK);
        t.setPadding(4, 8, 4, 8);
        content.addView(t);
        return t;
    }

    private void rowButton(String text, Runnable action) {
        Button b = new Button(this);
        b.setText(text);
        content.addView(b, new LinearLayout.LayoutParams(-1, -2));
        b.setOnClickListener(v -> action.run());
    }

    private int number(EditText e, int fallback) {
        try {
            return Integer.parseInt(e.getText().toString().trim());
        } catch (Exception ex) {
            return fallback;
        }
    }

    private void syncCoordinates() {
        if (xInput != null) xInput.setText(String.valueOf(x));
        if (yInput != null) yInput.setText(String.valueOf(y));
    }

    private View.OnTouchListener dragPanel() {
        return (v, e) -> {
            if (e.getAction() == MotionEvent.ACTION_DOWN) {
                v.setTag(new float[]{
                    e.getRawX(), e.getRawY(),
                    panelParams.x, panelParams.y
                });
                return true;
            }

            if (e.getAction() == MotionEvent.ACTION_MOVE) {
                float[] a = (float[]) v.getTag();
                panelParams.x = (int) (a[2] - e.getRawX() + a[0]);
                panelParams.y = (int) (a[3] + e.getRawY() - a[1]);
                wm.updateViewLayout(panel, panelParams);
                return true;
            }

            return e.getAction() == MotionEvent.ACTION_UP;
        };
    }

    private void startClicks() {
        if (running) return;

        if (AutoClickService.click(x, y) == false) {
            status.setText("Activa Accesibilidad primero");
            return;
        }

        running = true;
        status.setText("Ejecutando");

        clickTask = new Runnable() {
            @Override
            public void run() {
                if (!running) return;

                x = number(xInput, x);
                y = number(yInput, y);
                int interval = Math.max(10,
                    Math.min(2000, number(intervalInput, 100)));

                AutoClickService.click(x, y);
                clicks++;
                counter.setText("Clics: " + clicks);
                handler.postDelayed(this, interval);
            }
        };

        handler.post(clickTask);
    }

    private void pauseClicks() {
        running = false;
        if (clickTask != null) handler.removeCallbacks(clickTask);
        if (status != null) status.setText("Pausado");
    }

    @Override
    public void onDestroy() {
        pauseClicks();

        if (wm != null) {
            if (panel != null) wm.removeView(panel);
            if (marker != null) wm.removeView(marker);
        }

        super.onDestroy();
    }
}
