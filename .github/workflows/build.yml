name: AutoClickerNuevo APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Instalar componentes SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Corregir acceso del servicio
        run: sed -i 's/protected void onServiceConnected()/public void onServiceConnected()/' app/src/main/java/com/autoclicker/android/AutoClickService.java

      - name: Compilar APK
        run: gradle assembleDebug

      - name: Publicar APK para descargar
        uses: actions/upload-artifact@v4
        with:
          name: AutoClicker-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
